<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Notificator SDK and Strapi summer update</title>
  <desc id="description">Node SDK and Strapi extension cards connected to the Notificator service, with a small summer pause marker.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#091327"/>
      <stop offset="1" stop-color="#111d3c"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2457dc"/>
      <stop offset="1" stop-color="#3f86ff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" rx="36" fill="url(#background)"/>
  <circle cx="1080" cy="100" r="44" fill="#ffd35a"/>
  <g stroke="#ffd35a" stroke-width="7" stroke-linecap="round">
    <path d="M1080 29v-18M1080 189v-18M1009 100h-18M1169 100h-18M1030 50l-13-13M1143 163l-13-13M1130 50l13-13M1017 163l13-13"/>
  </g>
  <text x="70" y="90" fill="#8fb5ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700" letter-spacing="4">PROJECT UPDATE · 13 AUGUST 2026</text>
  <text x="70" y="155" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="46" font-weight="750">New ways to build.</text>
  <text x="70" y="205" fill="#b9c7e6" font-family="Inter, Arial, sans-serif" font-size="27">Then a short summer pause.</text>
  <g transform="translate(70 270)">
    <rect width="310" height="235" rx="26" fill="#ffffff"/>
    <rect x="24" y="24" width="62" height="62" rx="16" fill="url(#blue)"/>
    <text x="55" y="65" fill="#ffffff" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="800">JS</text>
    <text x="24" y="125" fill="#0b1428" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="750">Node.js SDK</text>
    <text x="24" y="158" fill="#52617d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="700">0.1.0 · NPM</text>
    <text x="24" y="202" fill="#52617d" font-family="Inter, Arial, sans-serif" font-size="18">Typed server-side alerts</text>
  </g>
  <g transform="translate(445 270)">
    <rect width="310" height="235" rx="26" fill="#f2efff" stroke="#c7b9ff" stroke-width="2"/>
    <rect x="24" y="24" width="62" height="62" rx="16" fill="#6f4cff"/>
    <text x="55" y="66" fill="#ffffff" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="800">S</text>
    <text x="24" y="125" fill="#0b1428" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="750">Strapi Extension</text>
    <text x="24" y="158" fill="#66539f" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="700">0.1.1 · SUBMITTED</text>
    <text x="24" y="202" fill="#52617d" font-family="Inter, Arial, sans-serif" font-size="18">Directory review begins</text>
  </g>
  <g transform="translate(820 270)">
    <rect width="310" height="235" rx="26" fill="#14264d" stroke="#345cae" stroke-width="2"/>
    <path d="M45 42h44a18 18 0 0 1 18 18v26a18 18 0 0 1-18 18H66l-21 18V42Z" fill="none" stroke="#79a8ff" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="95" cy="54" r="7" fill="#79a8ff"/>
    <text x="24" y="150" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="750">Notificator</text>
    <text x="24" y="182" fill="#8fb5ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="700">HOSTED DELIVERY</text>
    <text x="24" y="216" fill="#b9c7e6" font-family="Inter, Arial, sans-serif" font-size="18">Credentials stay protected</text>
  </g>
  <path d="M380 388h65M755 388h65" fill="none" stroke="#5d86df" stroke-width="5" stroke-linecap="round" stroke-dasharray="7 12"/>
  <text x="70" y="575" fill="#dce6ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700" letter-spacing="3">OPEN SOURCE · DOCUMENTED · READY TO TEST</text>
