<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Notificator for Strapi preview</title>
  <desc id="desc">A content event flows through a rule builder and becomes a Notificator alert.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f9ff"/>
      <stop offset="1" stop-color="#e9efff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#245be0"/>
      <stop offset="1" stop-color="#7047eb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#203361" flood-opacity=".13"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <circle cx="1420" cy="95" r="250" fill="#dfe7ff"/>
  <circle cx="115" cy="840" r="290" fill="#e8e3ff"/>

  <g transform="translate(110 82)">
    <rect width="1380" height="736" rx="42" fill="#fff" stroke="#d8e0f2" filter="url(#shadow)"/>
    <rect width="1380" height="112" rx="42" fill="#0b1020"/>
    <path d="M0 70h1380v42H0z" fill="#0b1020"/>

    <g transform="translate(42 32)">
      <path d="M4 0h42a12 12 0 0 1 12 12v24a12 12 0 0 1-12 12H20L4 60V0z" fill="none" stroke="#fff" stroke-width="3"/>
      <text x="82" y="34" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700">Notificator for Strapi</text>
    </g>
    <g transform="translate(1125 35)">
      <rect width="205" height="42" rx="21" fill="#29365d"/>
      <circle cx="24" cy="21" r="6" fill="#79e5bd"/>
      <text x="43" y="28" fill="#dce6ff" font-family="JetBrains Mono, monospace" font-size="16" font-weight="700">PREVIEW 0.1.0</text>
    </g>

    <text x="60" y="185" fill="#60708d" font-family="JetBrains Mono, monospace" font-size="18" font-weight="700" letter-spacing="2">CONTENT ACTIVITY, MADE USEFUL</text>
    <text x="60" y="244" fill="#0b1020" font-family="Inter, Arial, sans-serif" font-size="46" font-weight="760">From a content change to an alert</text>
    <text x="60" y="286" fill="#52617d" font-family="Inter, Arial, sans-serif" font-size="23">Build readable notifications from Strapi events without repeating lifecycle code.</text>

    <g transform="translate(60 352)">
      <g>
        <rect width="355" height="250" rx="26" fill="#f7f9fd" stroke="#d8e0f2"/>
        <circle cx="48" cy="48" r="20" fill="#e8f2ff"/>
        <path d="M39 48h18M48 39v18" stroke="#1769a8" stroke-width="3" stroke-linecap="round"/>
        <text x="80" y="55" fill="#1769a8" font-family="JetBrains Mono, monospace" font-size="16" font-weight="700">STRAPI EVENT</text>
        <text x="28" y="118" fill="#0b1020" font-family="Inter, Arial, sans-serif" font-size="29" font-weight="750">Article published</text>
        <text x="28" y="159" fill="#596984" font-family="Inter, Arial, sans-serif" font-size="19">Content type: Article</text>
        <text x="28" y="191" fill="#596984" font-family="Inter, Arial, sans-serif" font-size="19">Actor: Editor</text>
        <rect x="28" y="210" width="118" height="5" rx="2.5" fill="#b8c7e7"/>
      </g>

      <g transform="translate(400)">
        <path d="M0 125h70" stroke="#9ab0e1" stroke-width="4" stroke-linecap="round"/>
        <path d="m57 113 13 12-13 12" fill="none" stroke="#9ab0e1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      </g>

      <g transform="translate(470)">
        <rect width="355" height="250" rx="26" fill="#f1edff" stroke="#cfc2ff"/>
        <circle cx="48" cy="48" r="20" fill="#7047eb"/>
        <path d="M39 48h18M43 42l10 12M53 42 43 54" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
        <text x="80" y="55" fill="#5b3fc4" font-family="JetBrains Mono, monospace" font-size="16" font-weight="700">RULE BUILDER</text>
        <text x="28" y="118" fill="#0b1020" font-family="Inter, Arial, sans-serif" font-size="29" font-weight="750">Editorial updates</text>
        <text x="28" y="159" fill="#596984" font-family="Inter, Arial, sans-serif" font-size="19">Severity: Information</text>
        <text x="28" y="191" fill="#596984" font-family="Inter, Arial, sans-serif" font-size="19">Status: Enabled</text>
        <rect x="28" y="210" width="166" height="5" rx="2.5" fill="#9274ef"/>
      </g>

      <g transform="translate(870)">
        <path d="M0 125h70" stroke="#9ab0e1" stroke-width="4" stroke-linecap="round"/>
        <path d="m57 113 13 12-13 12" fill="none" stroke="#9ab0e1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      </g>

      <g transform="translate(940)">
        <rect width="320" height="250" rx="26" fill="url(#accent)"/>
        <circle cx="48" cy="48" r="20" fill="#fff" fill-opacity=".16"/>
        <path d="M39 50c4 0 4-10 9-10s5 10 10 10M40 55h16" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
        <text x="80" y="55" fill="#fff" font-family="JetBrains Mono, monospace" font-size="16" font-weight="700">NOTIFICATOR</text>
        <text x="28" y="118" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="29" font-weight="750">Article is live</text>
        <text x="28" y="159" fill="#e4eaff" font-family="Inter, Arial, sans-serif" font-size="19">Inbox • Push • Email</text>
        <text x="28" y="191" fill="#e4eaff" font-family="Inter, Arial, sans-serif" font-size="19">Optional MQTT delivery</text>
        <rect x="28" y="210" width="192" height="5" rx="2.5" fill="#8ce5c7"/>
      </g>
    </g>

    <g transform="translate(60 648)">
      <circle cx="9" cy="9" r="9" fill="#16a36f"/>
      <text x="30" y="16" fill="#3d4c68" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="650">Local Strapi activity works without an API key</text>
      <circle cx="455" cy="9" r="9" fill="#245be0"/>
      <text x="476" y="16" fill="#3d4c68" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="650">Connected delivery stays optional</text>
    </g>
  </g>
</svg>
